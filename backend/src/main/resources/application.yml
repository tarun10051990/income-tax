spring:
  application:
    name: income-tax-api
  datasource:
    url: jdbc:h2:mem:taxdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

jwt:
  secret: TaxFilrSecretKeyForJWTTokenGeneration2024MustBeAtLeast256BitsLong!!
  expiration: 86400000  # 24 hours

cors:
  allowed-origins: http://localhost:3000
