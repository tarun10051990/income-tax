spring:
  application:
    name: income-tax-api
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:taxdb}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    database-platform: ${DATABASE_DIALECT:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: ${DATABASE_DDL:update}
    show-sql: false
    # Response mapping walks lazy associations (customer, assignee, case) after the service
    # returns, so the session stays open for the request; queries use fetch joins where it matters.
    open-in-view: true
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

jwt:
  # Override in every deployment; the default only exists so local development runs out of the box.
  secret: ${JWT_SECRET:TaxFilrSecretKeyForJWTTokenGeneration2024MustBeAtLeast256BitsLong!!}
  expiration: ${JWT_EXPIRATION:28800000}  # 8 hours
  admin-expiration: ${JWT_ADMIN_EXPIRATION:3600000}  # 1 hour for administrative sessions

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  requests-per-minute: ${RATE_LIMIT_RPM:300}
  auth-requests-per-minute: ${RATE_LIMIT_AUTH_RPM:20}

documents:
  storage-dir: ${DOCUMENT_STORAGE_DIR:./data/documents}
  max-size-bytes: ${DOCUMENT_MAX_SIZE_BYTES:10485760}

app:
  # Creates the staff accounts required to operate a fresh installation.
  seed-demo-users: ${SEED_DEMO_USERS:false}
  seed-user-password: ${SEED_USER_PASSWORD:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
